dataset:
  name: metr-la
  data_dir: data/metr-la/
  adj_filename: data/metr-la/adj_mx.pkl
  num_nodes: 207          # changed from 325
  input_dim: 1
  seq_len: 12
  horizon: 12

model:
  hidden_dim: 64
  num_st_blocks: 4
  diffusion_steps: 2
  num_attention_heads: 4
  dilation_rates: [1, 2, 4, 8]
  kernel_size: 2
  bilstm_hidden: 64
  dropout: 0.3
  tod_embedding_dim: 32   # time-of-day slots = 288
  dow_embedding_dim: 32   # day-of-week slots = 7

training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  lr_patience: 10
  lr_decay_ratio: 0.5
  loss: hybrid            # MSE + NLL
  lambda_anneal_epochs: 10
  weight_decay: 0.0001
  clip_grad_norm: 5.0

uncertainty:
  mc_samples: 10
  dropout_active_at_inference: true

output:
  results_dir: results/metr-la/
  save_model: true
  model_path: results/metr-la/best_model.pt
